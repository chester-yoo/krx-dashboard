name: Daily KRX collection

on:
  schedule:
    - cron: "0 0 * * *" # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

# data/를 커밋하는 워크플로(daily·pledge_backfill·full_financials)는 한 번에 하나만 실행한다.
# 겹치면 OpenDART 일일 호출 한도를 나눠 쓰고 같은 데이터 파일을 서로 덮어쓰기 때문. 뒤에 온 실행은 앞 실행이 끝날 때까지 대기
concurrency:
  group: krx-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Collect daily data
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python collect.py daily

      - name: Update FX rates for foreign-currency filers (ECB via frankfurter.dev)
        run: python fx.py || echo "[fx] 환율 갱신 실패 - 기존 fx_rates.json 사용"

      - name: Update financial statements (OpenDART)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python financials.py update --years 3

      - name: Update major disclosures (OpenDART)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python disclosures.py update

      - name: Build dashboard summary
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        run: python build_summary.py

      - name: Build extended financial metrics
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        run: python build_ext_metrics.py

      - name: Update halt reasons (OpenDART exchange disclosures)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python halt_reasons.py update

      - name: Update designation stage (OpenDART exchange disclosures)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python designation_stage.py update

      - name: Restore pledge document cache
        uses: actions/cache@v4
        with:
          path: cache/pledge
          key: pledge-docs-${{ github.run_id }}
          restore-keys: pledge-docs-

      - name: Update share-pledge loans (OpenDART 대량보유상황보고서)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        # 신규 공시 위주로 짧게: 원문 300건·30분 상한. 남은 과거분(36개월 백필)은 pledge_backfill.yml이 받는다
        run: python pledge.py update --months 36 --max-docs 300 --max-minutes 30

      - name: Update pledge companies' CEO / audit opinion (OpenDART)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python pledge.py extra

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily KRX data update"
          # 실행 중 다른 커밋(코드 수정·수동 수집)이 올라왔으면 그 위에 얹는다. 데이터 파일이 겹치면 이번 실행 결과를 우선
          git pull --rebase -X theirs
          git push
