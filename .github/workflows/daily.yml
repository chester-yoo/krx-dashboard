name: Daily KRX collection

on:
  schedule:
    - cron: "0 0 * * *" # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Collect daily data
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python collect.py daily

      - name: Update FX rates for foreign-currency filers (ECB via frankfurter.dev)
        run: python fx.py || echo "[fx] 환율 갱신 실패 - 기존 fx_rates.json 사용"

      - name: Update financial statements (OpenDART)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python financials.py update --years 3

      - name: Update major disclosures (OpenDART)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python disclosures.py update

      - name: Build dashboard summary
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        run: python build_summary.py

      - name: Build extended financial metrics
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        run: python build_ext_metrics.py

      - name: Update halt reasons (OpenDART exchange disclosures)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python halt_reasons.py update

      - name: Update designation stage (OpenDART exchange disclosures)
        continue-on-error: true  # 한 단계가 실패해도 그날 수집한 시세(history)는 아래에서 커밋되도록
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python designation_stage.py update

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily KRX data update"
          # 실행 중 다른 커밋(코드 수정·수동 수집)이 올라왔으면 그 위에 얹는다. 데이터 파일이 겹치면 이번 실행 결과를 우선
          git pull --rebase -X theirs
          git push
