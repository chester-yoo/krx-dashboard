name: Full financials collection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sample (표본 10개사) / full (전체) / xbrl_sample (XBRL 주석 감가상각 표본) / xbrl (XBRL 감가상각 전체) / notes_sample (원문 주석 감가상각 표본) / notes (원문 주석 감가상각 전체) / notes_raw (상각 관련 주석 표 원본 전체 → 아티팩트) / full_refresh (전체 재무제표 전 종목 재수집)"
        required: true
        default: sample

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Collect full financial statements (OpenDART)
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: python full_financials.py ${{ inputs.mode }}

      - name: Upload raw notes tables
        if: inputs.mode == 'notes_raw'
        uses: actions/upload-artifact@v4
        with:
          name: notes_raw
          path: out/notes_raw.json.gz
          retention-days: 30

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Full financials collection (${{ inputs.mode }})"
          git pull --rebase
          git push
