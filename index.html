<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상장사 시가총액 Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f4; --panel:#ffffff; --ink:#161c26; --ink-soft:#4a5260; --ink-mute:#5b6472;
    --line:#e3e5e1; --line-strong:#c9cdc6;
    --navy:#1f2b3d; --navy-soft:#3a4a63; --blue:#1f4b8f;
    --neg:#c62828;
    --mono: 'Noto Sans KR', sans-serif;
    --side-w:208px; --drawer-w:560px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,sans-serif;font-size:14px;line-height:1.5;}
  button{font-family:inherit;}
  .layout{display:flex;min-height:100vh;}

  .sidebar{width:var(--side-w);flex:0 0 var(--side-w);background:var(--navy);color:#fff;padding:22px 0;position:sticky;top:0;align-self:flex-start;height:100vh;display:flex;flex-direction:column;}
  .sidebar h1{font-size:15px;font-weight:700;margin:0 18px 20px;line-height:1.35;}
  .sidebar nav a{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 18px;color:#c9d2e0;text-decoration:none;font-size:13.5px;font-weight:500;border-left:3px solid transparent;}
  .sidebar nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar nav a.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#f2d49b;font-weight:700;}
  .sidebar nav a small{display:block;font-size:11px;color:#a9b4c6;font-weight:400;margin-top:1px;}
  .nav-count{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:1px 8px;margin-top:1px;font-variant-numeric:tabular-nums;}
  .side-foot{margin-top:auto;padding:14px 18px 0;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:#a9b4c6;line-height:1.6;}
  .side-foot b{display:block;color:#fff;font-size:13px;}

  .main{flex:1;min-width:0;padding:24px 22px 56px;max-width:1500px;transition:margin-right .2s;}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:16px;border-bottom:2px solid var(--navy);padding-bottom:14px;}
  .titleblock h2{font-size:19px;font-weight:700;margin:0 0 4px;color:var(--navy);}
  .titleblock p{margin:0;color:var(--ink-soft);font-size:12.5px;}
  .head-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .dday{font-size:13px;font-weight:700;color:#7a4e05;background:#fdf3e1;border:1px solid #f0d8a8;border-radius:14px;padding:3px 12px;white-space:nowrap;}
  .asof-mobile{display:none;font-size:12.5px;font-weight:700;color:var(--ink);}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:14px;}
  .controls-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .field input, .field select{padding:6px 8px;border:1px solid var(--line-strong);border-radius:4px;font-family:var(--mono);font-size:13px;width:110px;}
  .field input[type=text]{width:180px;font-family:inherit;}
  .field select{width:140px;font-family:inherit;background:#fff;}
  .field.check{flex-direction:row;align-items:center;gap:6px;padding-bottom:7px;}
  .field.check input{width:auto;}
  .field.check label{font-size:12.5px;}
  .fin-group{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong);}
  .fin-group .glabel{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;}
  button{cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:7px 14px;border-radius:4px;font-size:12.5px;font-weight:600;}
  button:hover{opacity:0.9;}
  button.secondary{background:#fff;color:var(--navy);}
  button.ghost{background:#fff;color:var(--ink-soft);border-color:var(--line-strong);}
  button.ghost.on{background:#eef2fa;color:var(--blue);border-color:#b9c9e6;}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;}
  .seg button{border:none;border-radius:0;background:#fff;color:var(--ink-soft);padding:6px 12px;}
  .seg button.on{background:var(--navy);color:#fff;}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-align:left;color:var(--ink);font-weight:400;cursor:pointer;}
  .card:hover{border-color:var(--line-strong);opacity:1;}
  .card.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#f7f9fd;}
  .card .num{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
  .card .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .card.tone-amber .num{color:#7a4e05;} .card.tone-dark .num{color:#5c3b03;}

  .dist{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto;}
  .dist-bar{display:flex;flex:0 0 12px;height:12px;border-radius:7px;overflow:hidden;background:var(--line);}
  .dist-bar span{display:block;height:100%;border-right:2px solid #fff;}
  .dist-legend{display:flex;flex-wrap:wrap;gap:6px;}
  .dist-legend button{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;padding:1px 9px;font-size:12px;border-radius:14px;}
  .dist-legend button.on{border-color:var(--blue);background:#f7f9fd;}
  .dist-legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .halt-top{display:grid;grid-template-columns:170px 1fr;gap:10px;margin-bottom:14px;}
  /* 화면마다 표 시작 위치를 같게: 상단 카드 영역 높이 고정 */
  .cards, .halt-top{height:86px;} .cards .card, .halt-top > *{height:86px;box-sizing:border-box;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .toolbar .count{font-size:13px;color:var(--ink-soft);}
  .toolbar .count b{color:var(--ink);}
  .toolbar .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .chip{background:#eef2fa;color:var(--blue);border:1px solid #b9c9e6;border-radius:14px;padding:3px 10px;font-size:12px;font-weight:600;}
  .note-panel{background:#fbfbfa;border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-bottom:10px;font-size:12.5px;color:var(--ink-soft);line-height:1.65;}

  .tbl-area{display:flex;gap:14px;align-items:flex-start;}
  .tbl-main{flex:0 1 auto;min-width:0;max-width:100%;}
  .side-panel{flex:1 1 260px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
  .side-panel h4{margin:0 0 10px;font-size:13px;color:var(--navy);}
  .ind-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;background:none;border:none;color:var(--ink);font-weight:400;padding:5px 2px;text-align:left;border-radius:4px;}
  .ind-row:hover{background:#f5f6f4;opacity:1;}
  .ind-row .bar{grid-column:1 / -1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
  .ind-row .bar i{display:block;height:100%;background:#7f97c2;}
  .ind-row .cnt{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:12.5px;}

  table{border-collapse:collapse;font-size:13px;}
  #stockTable{width:auto;}
  thead th{position:sticky;z-index:2;background:var(--navy);color:#fff;text-align:center;padding:8px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  thead tr.grp th{top:0;height:26px;padding:4px 9px;background:#16202f;color:#c9d2e0;font-size:11px;font-weight:500;letter-spacing:.02em;}
  thead tr.lab th{top:26px;height:34px;cursor:pointer;}
  thead tr.hf th{top:60px;background:#2c3b52;padding:4px 6px;cursor:default;font-weight:400;}
  thead th .arr{opacity:.8;font-size:9px;margin-left:3px;}
  thead th .tip{display:inline-block;margin-left:4px;color:#c9d2e0;font-weight:400;cursor:help;}
  tbody td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;}
  tbody tr:hover td{background:#f5f6f4;cursor:pointer;}
  tbody tr.selected td{background:#eef2fa;}
  td.num, th.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;}
  td.ctr, th.ctr{text-align:center;}
  td.gs, th.gs{border-left:2px solid var(--line-strong);}
  thead th.gs{border-left:2px solid #4a5a75;}
  .clip{display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;}
  td.sticky, th.sticky{position:sticky;left:0;z-index:1;}
  thead th.sticky{z-index:3;}
  td.neg{color:var(--neg);}
  td.negb{color:var(--neg);font-weight:700;}
  td.mute{color:var(--ink-mute);}
  td.key{font-weight:700;}
  .tablewrap{height:max(420px, calc(100vh - 330px));overflow:auto;border:1px solid var(--line);border-radius:6px;background:#fff;}
  tbody tr{height:37px;}
  tbody td .badge{line-height:1.35;}
  body[data-view="all"] .side-panel{flex:0 0 260px;max-width:260px;}
  body[data-view="all"] th[data-key="per"], body[data-view="all"] th[data-key="evEbitda"]{width:110px;}
  body[data-view="all"] #filterPanel .controls-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));}
  body[data-view="all"] #filterPanel .field input, body[data-view="all"] #filterPanel .field select{width:100%;}
  .tbl-main{flex:1 1 auto;}
  #stockTable{width:100%;}
  thead tr.hf input, thead tr.hf select{width:100%;min-width:64px;font-size:11.5px;padding:3px 4px;border:1px solid var(--line-strong);border-radius:3px;font-family:inherit;background:#fff;color:var(--ink);}
  .rng-btn{width:100%;min-width:64px;background:#fff;color:var(--ink-soft);border:1px solid var(--line-strong);padding:3px 6px;font-size:11.5px;font-weight:500;border-radius:3px;}
  .rng-btn.on{color:var(--blue);border-color:#7f97c2;font-weight:700;}
  .pop{position:absolute;top:100%;right:0;z-index:5;background:#fff;border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.15);padding:10px;display:flex;flex-direction:column;gap:6px;width:170px;color:var(--ink);text-align:left;}
  .pop label{font-size:11.5px;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;}
  .pop input{width:100%;}

  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid;text-decoration:none;}
  a.badge:hover{text-decoration:underline;}
  .s-watch{background:#fdf3e1;color:#7a4e05;border-color:#f0d8a8;}
  .s-danger{background:#f5d39b;color:#5c3b03;border-color:#e3b45f;}
  .s-crit{background:#8a5a06;color:#fff;border-color:#8a5a06;}
  .r-risk{background:#fbe7e3;color:#8f2a1a;border-color:#f0bcaf;}
  .r-tech{background:#eef0f2;color:#3f4652;border-color:#cdd2d9;}
  .r-other{background:#e8edf5;color:#1f4b8f;border-color:#b9c9e6;}
  .g-warn{background:#fdf3e1;color:#7a4e05;border-color:#f0d8a8;}
  .g-risk{background:#fbe7e3;color:#8f2a1a;border-color:#f0bcaf;}
  .g-dark{background:#7a2115;color:#fff;border-color:#7a2115;}
  .g-off{background:#eef0f2;color:#3f4652;border-color:#cdd2d9;}
  .b-crit{background:#7a2115;color:#fff;border-color:#7a2115;}
  .b-danger{background:#fbe7e3;color:#8f2a1a;border-color:#f0bcaf;}
  .when{font-size:11.5px;color:var(--ink-mute);margin-left:6px;}
  .mkt-pill{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:3px;border:1px solid;}
  .mkt-pill.kospi{background:#e8edf5;color:#1f4b8f;border-color:#b9c9e6;}
  .mkt-pill.kosdaq{background:#fdf6d9;color:#7a5f00;border-color:#eadd9a;}
  .prog{display:inline-block;width:44px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px;}
  .prog i{display:block;height:100%;background:#c98a1a;}
  .prog.full i{background:#8a5a06;}
  .gbar{display:inline-block;width:60px;height:8px;background:#f1f2f0;border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:8px;direction:rtl;}
  .gbar i{display:block;height:100%;background:#d28a5a;}

  .pager{display:flex;gap:4px;justify-content:center;align-items:center;padding:10px 0 2px;flex-wrap:wrap;}
  .pager button{background:#fff;color:var(--ink);border:1px solid var(--line-strong);padding:4px 10px;font-weight:500;min-width:34px;}
  .pager button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .pager button:disabled{opacity:.4;cursor:default;}
  .pager span{color:var(--ink-mute);padding:0 4px;}
  .empty{padding:36px 20px;text-align:center;color:var(--ink-mute);}

  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(var(--drawer-w),100vw);background:#fff;box-shadow:-10px 0 28px rgba(16,24,40,.16);transform:translateX(105%);transition:transform .2s;z-index:50;display:flex;flex-direction:column;}
  .drawer.open{transform:none;}
  .dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line);}
  .dr-head h3{margin:0;font-size:16px;color:var(--navy);}
  .dr-head .sub{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
  .dr-close{background:#fff;color:var(--ink-soft);border:1px solid var(--line-strong);padding:6px 12px;white-space:nowrap;flex-shrink:0;}
  .dr-body{overflow:auto;padding:14px 20px 28px;}
  .dr-body h4{font-size:12.5px;color:var(--ink-soft);margin:18px 0 8px;font-weight:700;}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;} .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .note{font-size:12px;color:var(--ink-mute);margin-top:6px;line-height:1.55;}
  .fin-tbl{width:100%;font-size:12.5px;}
  .fin-tbl th{position:static;background:#fff;color:var(--ink);border-bottom:2px solid var(--line-strong);padding:6px 8px;font-size:12px;}
  .fin-tbl td{padding:5px 8px;border-bottom:1px solid var(--line);}
  /* 주담대 스크리닝 */
  .flag{display:inline-block;font-size:10.5px;font-weight:600;padding:0 6px;margin:1px 2px 1px 0;border-radius:3px;border:1px solid #cdd2d9;background:#eef0f2;color:#3f4652;white-space:nowrap;}
  .flag.hi{background:#fbe7e3;color:#8f2a1a;border-color:#f0bcaf;}
  .flag.rv{background:#e8edf5;color:#1f4b8f;border-color:#b9c9e6;}
  .pl-charts{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px;}
  .pl-charts .panel{margin:0;}
  .pl-charts h4, .pl-sec h4{margin:0 0 8px;font-size:13px;color:var(--navy);}
  .pl-chart{position:relative;height:260px;}
  .assump-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;}
  .assump-grid .field input, .assump-grid .field select{width:100%;}
  .pts{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .assump-grid.pts-grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
  .pts input{width:46px;padding:4px 6px;border:1px solid var(--line-strong);border-radius:4px;font-size:12.5px;}
  .disclaimer{font-size:12px;color:var(--ink-soft);line-height:1.7;border-top:1px solid var(--line);margin-top:16px;padding-top:10px;}
  .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:12.5px;}
  .kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:3px 0;}
  .kv span{color:var(--ink-soft);}
  .dr-body .fin-tbl td{white-space:nowrap;}
  .tblscroll{overflow-x:auto;}
  .memo textarea{width:100%;min-height:80px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:4px;font-family:inherit;font-size:13px;}
  .memo .controls-row .field input, .memo .controls-row .field select{width:150px;}
  .review-list{font-size:12.5px;}
  .review-list li{margin:3px 0;}
  #pledgeTable{width:100%;}
  @media (max-width:860px){ .pl-charts{grid-template-columns:1fr;} .kv{grid-template-columns:1fr;} }
  @media (min-width:1280px){ body.drawer-open .main{margin-right:var(--drawer-w);} }
  @media (max-width:860px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;flex:none;height:auto;position:static;padding:12px 0 0;}
    .sidebar h1{margin:0 14px 8px;}
    .sidebar nav{display:flex;overflow-x:auto;}
    .sidebar nav a{flex:0 0 auto;border-left:none;border-bottom:3px solid transparent;padding:8px 14px;}
    .sidebar nav a small{display:none;}
    .sidebar nav a.active{border-bottom-color:#f2d49b;}
    .side-foot{display:none;}
    .main{padding:16px 12px 40px;}
    header{flex-direction:column;align-items:flex-start;gap:6px;}
    .head-right{align-items:flex-start;}
    .asof-mobile{display:block;}
    .halt-top{grid-template-columns:1fr;}
    .cards, .halt-top, .cards .card, .halt-top > *{height:auto;}
    .tablewrap{height:70vh;}
    .tbl-area{flex-direction:column;}
    .side-panel{max-width:none;width:100%;}
    .field input[type=text]{width:100%;}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>상장사 시가총액<br>Dashboard</h1>
    <nav id="nav" aria-label="메뉴"></nav>
    <div class="side-foot" id="sideFoot">데이터 불러오는 중...</div>
  </aside>

  <div class="main">
    <header>
      <div class="titleblock">
        <h2 id="viewTitle">-</h2>
        <p id="viewDesc"></p>
      </div>
      <div class="head-right"><span id="dday"></span><span class="asof-mobile" id="asofMobile"></span></div>
    </header>

    <div id="cardsArea"></div>
    <div class="panel" id="filterPanel"></div>

    <div id="tablePanel" style="display:none;">
      <div class="toolbar">
        <div class="count" id="tblCount"></div>
        <div class="actions" id="tblActions"></div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="note-panel" id="notePanel" style="display:none;"></div>
      <div class="tbl-area">
        <div class="tbl-main">
          <div class="tablewrap">
            <table id="stockTable"><thead id="stockHead"></thead><tbody id="stockBody"></tbody></table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
        <aside class="side-panel" id="sidePanel" style="display:none;"></aside>
      </div>
    </div>

    <div class="panel empty" id="emptyState">데이터를 불러오는 중입니다...</div>
    <div id="pledgeView" style="display:none;"></div>
  </div>
</div>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="종목 상세">
  <div class="dr-head">
    <div><h3 id="detailName">-</h3><div class="sub" id="detailSub">-</div></div>
    <button class="dr-close" id="closeDetail" aria-label="상세 닫기">닫기</button>
  </div>
  <div class="dr-body">
    <div id="stockDetail">
      <div style="position:relative;height:220px;"><canvas id="trendChart"></canvas></div>
      <div class="legend" id="chartLegend"></div>
      <div id="financialsPanel"></div>
      <div id="disclosuresPanel"></div>
    </div>
    <div id="pledgeDetail" style="display:none;"></div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const SUMMARY_URL = 'data/summary.json';
const FINANCIALS_URL = 'data/financials.json';
const DISCLOSURES_URL = 'data/disclosures.json';
const HALT_REASONS_URL = 'data/halt_reasons.json';
const STAGE_URL = 'data/designation_stage.json';
const EXT_URL = 'data/fin_ext.json';

/* ---------- 데이터 가공 ---------- */
function buildFin(code){
  const fm = financialsMap[code];
  if(!fm) return null;
  const ys = Object.keys(fm).sort().reverse();
  if(!ys.length) return null;
  const d = fm[ys[0]];
  const prev = ys[1] && Number(ys[1]) === Number(ys[0])-1 ? fm[ys[1]] : null;
  const f = {
    year: ys[0], fsDiv: d.fs_div==='CFS' ? '연결' : '별도',
    rev: toEok(d.revenue), op: toEok(d.operating_profit), ni: toEok(d.net_income),
    assets: toEok(d.assets), liab: toEok(d.liabilities), eq: toEok(d.equity), capital: toEok(d.capital),
    // PER·PBR 분모는 지배주주 몫(연결). 별도 기준이거나 값이 없으면 전체 순이익·자본총계
    niC: toEok(d.net_income_ctrl ?? d.net_income), eqC: toEok(d.equity_ctrl ?? d.equity),
    years: ys.map(y=>({year:y, d:fm[y]})),
  };
  f.opm = f.rev>0 && f.op!=null ? f.op/f.rev*100 : null;
  f.nim = f.rev>0 && f.ni!=null ? f.ni/f.rev*100 : null;
  f.eqNonPos = f.eq!=null && f.eq<=0;
  f.debt = f.eq>0 && f.liab!=null ? f.liab/f.eq*100 : null;
  const pr = prev ? toEok(prev.revenue) : null;
  f.growth = pr>0 && f.rev!=null ? (f.rev/pr-1)*100 : null;
  if(f.eq==null) f.impair = null;
  else if(f.eq<0) f.impair = 'full';
  else if(f.capital!=null) f.impair = f.eq < f.capital ? 'part' : 'none';
  else f.impair = 'unk';
  return f;
}

function computeStock(s){
  const n = s.cap.length;
  const vals = s.cap.filter(v=>v!=null);
  s.latest = vals.length ? vals[vals.length-1] : null;
  s.chg20 = vals.length > CHANGE_DAYS && vals[vals.length-1-CHANGE_DAYS] > 0 ? (s.latest/vals[vals.length-1-CHANGE_DAYS]-1)*100 : null;

  const tail = vals.slice(-REG.avgDays);
  s.avgN = tail.length;
  s.avg = tail.length ? tail.reduce((a,b)=>a+b,0)/tail.length : null;

  const tCur = thr(s.m,'current');
  let streak = 0;
  for(let i=n-1;i>=0;i--){ const v=s.cap[i]; if(v==null) continue; if(v<tCur) streak++; else break; }
  s.streak = streak;
  s.gapCur = s.latest!=null ? (s.latest/tCur-1)*100 : null;
  if(streak >= REG.current.streakDays){ s.status='crit'; s.statusLabel=`${REG.current.streakDays}일+ 연속 미달`; s.statusRank=3; }
  else if(streak >= DANGER_DAYS){ s.status='danger'; s.statusLabel=`${DANGER_DAYS}일+ 연속 미달`; s.statusRank=2; }
  else if(streak >= 1){ s.status='watch'; s.statusLabel='연속 미달'; s.statusRank=1; }
  else { s.status='safe'; s.statusLabel='기준 충족'; s.statusRank=0; }

  const tNext = thr(s.m,'next');
  s.gapNew = s.avg!=null ? (s.avg/tNext-1)*100 : null;
  s.gapCurAvg = s.avg!=null ? (s.avg/tCur-1)*100 : null;

  let k = 0;
  while(k<n && s.h[n-1-k]==='1') k++;
  s.halted = k>0;

  s.fin = buildFin(s.c);
}

function colsFor(view){
  const v = VIEWS[view], st = viewState[view];
  const all = Object.assign({}, C, makeFinCols(v.basis), extCols(v.basis));
  const mk = (k, extra) => { const c = Object.assign({key:k}, all[k], (v.colOpts||{})[k], extra); if(c.ft===undefined && c.num) c.ft='range'; return c; };
  if(st.finMode==='all' && v.cols.filter(k=>FIN_ALL.includes(k)).length > 1){
    const base = v.cols.filter(k=>!FIN_ALL.includes(k) && !EXT_KEYS.includes(k) && !(v.hideStatusInFull && all[k].grp==='status')).map(k=>mk(k));
    const tail = ['per','pbr','evEbitda','nd','ocf','icr','impair'].filter(k=>v.cols.includes(k) || EXT_KEYS.includes(k)).map(k=>mk(k, {grp:'val'}));
    return [...base, ...yearCols(), ...tail];
  }
  return v.cols
    .filter(k=>!(st.finMode==='core' && FIN_ALL.includes(k) && !all[k].core))
    .map(k=>mk(k));
}

/* ---------- 필터 적용 ---------- */
function num(v){ return v==='' || v==null ? null : Number(v); }
function headerPass(s, cols, h){
  for(const c of cols){
    if(!c.ft) continue;
    if(c.ft==='text'){
      const q = (h[c.key]||'').trim().toLowerCase();
      if(q && !String(c.get(s)??'').toLowerCase().includes(q)) return false;
    } else if(c.ft==='select'){
      const val = h[c.key];
      if(val){ const x = c.sel(s); if(val==='__blank__' ? x!=='' : x!==val) return false; }
    } else {
      const mn = num(h[c.key+'_min']), mx = num(h[c.key+'_max']);
      if(mn!=null || mx!=null){ const x = c.get(s); if(x==null || (mn!=null && x<mn) || (mx!=null && x>mx)) return false; }
    }
  }
  return true;
}
function applyFilters(view){
  const v = VIEWS[view], st = viewState[view], f = st.f;
  const q = (f.q||'').trim().toLowerCase();
  const capMin=num(f.capMin), capMax=num(f.capMax), streakMin=num(f.streakMin);
  // 헤더 필터는 지금 화면에 보이는 컬럼(재무 핵심/전체 모드 반영)에만 적용한다
  const hcols = v.headerFilters ? colsFor(view) : null;
  return stocks.filter(v.base).filter(s=>{
    if(hcols && !headerPass(s,hcols,st.h)) return false;
    if(q && !s.n.toLowerCase().includes(q) && !s.c.toLowerCase().includes(q)) return false;
    if(f.market && s.m!==f.market) return false;
    if(f.industry && s.i!==f.industry) return false;
    if(capMin!=null && !(s.latest>=capMin)) return false;
    if(capMax!=null && !(f.capMaxExcl ? s.latest<capMax : s.latest<=capMax)) return false;
    if(streakMin!=null && s.streak<streakMin) return false;
    if(f.status && s.status!==f.status) return false;
    if(f.stageF){ const x = s.stage ? s.stage.label : ''; if(f.stageF==='__any__' ? x==='' : (f.stageF==='__blank__' ? x!=='' : x!==f.stageF)) return false; }
    if(f.gapBand && !gapInBand(s.gapNew, f.gapBand)) return false;
    return true;
  });
}

function renderCards(){

function renderHaltTop(list, st, area){

  const kinds = Object.entries(by).sort((a,b)=> (a[0]==='') - (b[0]==='') || order[reasonGroup(a[0])]-order[reasonGroup(b[0])] || b[1]-a[1]);

    <div class="dist" aria-label="정지 사유 분포">
      <div class="dist-bar">${kinds.map(([k,n])=>`<span style="width:${n/total*100}%;background:${color(k)}" title="${esc(k||'사유 미확인')} ${n}"></span>`).join('')}</div>
      <div class="dist-legend">${kinds.map(([k,n])=>{ const key = k===''?'__blank__':k; return `<button data-reason="${esc(key)}" class="${cur===key?'on':''}" aria-pressed="${cur===key}"><i style="background:${color(k)}"></i>${esc(k||'사유 미확인')} <b>${n}</b></button>`; }).join('')}</div>
    </div></div>`;

function chipList(){
  const v = VIEWS[currentView], st = viewState[currentView], chips = [];
  const defs = v.filters;
  defs.forEach(d=>{
    const x = st.f[d.id];
    if(x==null || x==='' || x===false) return;
    let text;
    if(d.type==='check') text = d.label;
    else if(d.type==='select'){ const opts = d.opts==='industry' ? [[x,x]] : d.opts; text = `${d.label}: ${(opts.find(o=>o[0]===x)||[x,x])[1]}`; }
    else text = `${d.label}: ${x}`;
    chips.push({text, clear:()=>{ delete st.f[d.id]; if(d.id==='capMax') delete st.f.capMaxExcl; }});
  });
  if(st.f.gapBand) chips.push({text:`신규 기준 대비 ${GAP_BANDS[st.f.gapBand][0]}`, clear:()=>{ delete st.f.gapBand; }});
  if(v.headerFilters){
    const cols = colsFor(currentView);
    Object.entries(st.h).forEach(([k,x])=>{
      if(x==null || x==='') return;
      const base = k.replace(/_(min|max)$/,''), col = cols.find(c=>c.key===base) || {label:base};
      const text = k.endsWith('_min') ? `${col.label} ≥ ${x}` : k.endsWith('_max') ? `${col.label} ≤ ${x}` : `${col.label}: ${x==='__blank__'?'(공란)':x}`;

/* ---------- 엑셀 내려받기 ---------- */
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let xlsxLoading = null;
function loadXlsx(){
  // 처음 누를 때만 라이브러리를 받는다(초기 화면 속도 유지)
  if(window.XLSX) return Promise.resolve();
  return xlsxLoading = xlsxLoading || new Promise((ok, fail)=>{
    const sc = document.createElement('script'); sc.src = XLSX_URL; sc.onload = ok;
    sc.onerror = ()=>{ xlsxLoading = null; fail(new Error('엑셀 라이브러리를 불러오지 못했습니다')); };
    document.head.appendChild(sc);
  });
}
const PCT_KEYS = new Set(['opm','nim','debt','growth','gapCur','gapNew','gapCurAvg','chg20']);
const X_KEYS = new Set(['per','pbr','evEbitda','icr']);
function plainText(html){ const d = document.createElement('div'); d.innerHTML = html; return d.textContent.trim(); }
function exportCols(view){
  // 재무 컬럼이 있는 탭은 '재무 전체' 모드 기준 전체 컬럼을 내보낸다.
  // 화면의 재무 전체 모드는 폭 때문에 상태 컬럼(정지 사유·연속 미달·공시 단계)을 숨기지만, 파일에는 모두 넣는다
  const st = viewState[view], v = VIEWS[view], mode = st.finMode, hide = v.hideStatusInFull;
  st.finMode = 'all'; v.hideStatusInFull = false;
  try { return colsFor(view); } finally { st.finMode = mode; v.hideStatusInFull = hide; }
}
const EOK_KEYS = new Set(['cap','avg','rev','op','ni','assets','liab','eq','nd','ocf']);
function exportUnit(c){
  if(PCT_KEYS.has(c.key)) return ' (%)';
  if(X_KEYS.has(c.key)) return ' (배)';
  if(EOK_KEYS.has(c.key)) return ' (억원)';
  if(c.key==='streak') return ' (거래일)';
  return '';
}
function exportHeader(c){
  if(c.grp && c.grp.startsWith('fy_')) return `${GROUPS[c.grp]}${/^fy_(opm|debt)$/.test(c.grp) ? ' (%)' : ''} ${c.label}`;
  return c.label + exportUnit(c);
}
function exportValue(c, s){
  if(c.num){
    const v = c.get(s);
    if(v!=null && v!=='' && isFinite(v)){
      const pct = PCT_KEYS.has(c.key) || /^y_(opm|debt)_/.test(c.key);
      return {v:Number(v), t:'n', z: X_KEYS.has(c.key) ? '0.00' : (pct ? '0.0' : '#,##0')};
    }
  }
  if(c.key==='code') return {v:String(s.c), t:'s'};  // 종목코드 앞자리 0 유지
  if(c.key==='reason' || c.key==='stage'){ const x = s[c.key]; return {v: x ? `${x.label} (${formatDate(x.date)})` : '', t:'s'}; }
  const txt = plainText(c.cell(s));
  return {v: txt==='-' ? '' : txt, t:'s'};  // N/M·배지 등은 화면 글자 그대로
}
function exportRemark(s){
  const e = s.ext, out = [];
  if(e && e.icr!=null && e.icr_basis==='금융비용') out.push('이자보상배율: 금융비용 기준 근사치(*)');
  if(e && e.da_chk==='불일치') out.push(`EV/EBITDA: 감가상각비 주석·XBRL 10% 넘게 차이(†), 다른 출처 값 ${e.da_alt}억`);
  if(e && e.da_src) out.push(`감가상각비 출처: ${e.da_src}`);
  if(e && e.cur) out.push(`외화 공시(${e.cur}) 원화 환산`);
  return out.join(' / ');
}
async function exportXlsx(btn){
  const v = VIEWS[currentView], st = viewState[currentView];
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '만드는 중...';
  try {
    await loadXlsx();
    const cols = exportCols(currentView);
    const list = sortList(applyFilters(currentView), colsFor(currentView), st);
    const ws = XLSX.utils.aoa_to_sheet([[...cols.map(exportHeader), '비고']]);
    list.forEach((s, i)=>{
      cols.forEach((c, j)=>{ const x = exportValue(c, s); if(x.v!=='') ws[XLSX.utils.encode_cell({r:i+1, c:j})] = x; });
      const rm = exportRemark(s);
      if(rm) ws[XLSX.utils.encode_cell({r:i+1, c:cols.length})] = {v:rm, t:'s'};
    });
    const range = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:Math.max(list.length,1), c:cols.length}});
    ws['!ref'] = range;
    ws['!autofilter'] = {ref: range};
    ws['!cols'] = [...cols.map(c=>({wch: Math.max(9, Math.min(26, exportHeader(c).length + 4))})), {wch:70}];
    const info = [
      ['항목', '내용'],
      ['화면', v.title],
      ['데이터 기준일', asofDate || '-'],
      ['내려받은 시각', new Date().toLocaleString('ko-KR')],
      ['종목 수', list.length],
      ['적용 필터', chipList().map(c=>c.text).join(' · ') || '없음'],
      ['정렬', `${(colsFor(currentView).find(c=>c.key===st.sortKey)||{label:st.sortKey}).label} ${st.sortDir>0?'오름차순':'내림차순'}`],
      ['출처', '시세·시가총액: 한국거래소(KRX) / 재무: OpenDART 재무제표·사업보고서 원문 주석(자동 추출) / 업종: 네이버 금융 / 환율: 유럽중앙은행(ECB) 기준환율'],
      ['화면 기준 설명', v.note],
      ['재무 지표 기준', EXT_TIP],
      ['비고 기호', '* 이자보상배율을 이자비용 대신 금융비용으로 계산한 근사치 / † 감가상각비 주석값이 XBRL과 10% 넘게 달라 검증이 필요한 값'],
      ['유의사항', '대시보드 자체 계산값이며 KRX·DART 원문과 다를 수 있습니다. 투자 판단 전 원문 공시를 확인하세요. EV/EBITDA·PER·PBR은 데이터 기준일 시가총액으로 계산되어 날짜마다 달라집니다.'],
      [],
      ['컬럼', '설명'],
      ...cols.filter(c=>c.tip).map(c=>[exportHeader(c), c.tip]),
    ];
    const ws2 = XLSX.utils.aoa_to_sheet(info);
    ws2['!cols'] = [{wch:24}, {wch:120}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '데이터');
    XLSX.utils.book_append_sheet(wb, ws2, '설명');
    XLSX.writeFile(wb, `${v.nav}_${(asofDate||'').replace(/-/g,'')}.xlsx`);
    btn.textContent = label;
  } catch(err){
    console.error(err);
    btn.textContent = '다운로드 실패';
    setTimeout(()=>{ btn.textContent = label; }, 2500);
  } finally {
    btn.disabled = false;
  }
}

/* ---------- 렌더: 표 ---------- */
function headFilterCell(c, st, baseList){
  const cls = ['hf-cell', c.sticky?'sticky':'', c.gs?'gs':''].join(' ').trim();
  if(!c.ft) return `<th class="${cls}"></th>`;
  const h = st.h;
  if(c.ft==='text') return `<th class="${cls}"><input type="text" data-h="${c.key}" value="${esc(h[c.key]||'')}" placeholder="검색" aria-label="${esc(c.label)} 검색"></th>`;
  if(c.ft==='select'){
    const vals = [...new Set(baseList.map(c.sel))].filter(x=>x!=='').sort((a,b)=>String(a).localeCompare(String(b),'ko'));
    const blank = baseList.some(x=>c.sel(x)==='');
    const cur = h[c.key]||'';
    return `<th class="${cls}"><select data-h="${c.key}" aria-label="${esc(c.label)} 필터"><option value="">전체</option>${vals.map(x=>`<option value="${esc(x)}" ${x===cur?'selected':''}>${esc(x)}</option>`).join('')}${blank?`<option value="__blank__" ${cur==='__blank__'?'selected':''}>(공란)</option>`:''}</select></th>`;
  }
  const mn = h[c.key+'_min'], mx = h[c.key+'_max'], on = (mn!=null && mn!=='') || (mx!=null && mx!=='');
  const lbl = on ? `${mn||''}~${mx||''}` : '범위';
  return `<th class="${cls}"><button class="rng-btn ${on?'on':''}" data-rng="${c.key}" aria-label="${esc(c.label)} 범위 필터">${esc(lbl)}</button>${openPop===c.key?`<div class="pop" role="dialog" aria-label="${esc(c.label)} 범위"><label>최소<input type="number" data-h="${c.key}_min" value="${esc(mn||'')}"></label><label>최대<input type="number" data-h="${c.key}_max" value="${esc(mx||'')}"></label><button class="secondary" data-popclose>닫기</button></div>`:''}</th>`;
}
function sortList(list, cols, st){
  const sc = cols.find(c=>c.key===st.sortKey) || cols[0];
  return list.sort((a,b)=>{
    const av=sc.get(a), bv=sc.get(b);
    const an = av==null || av==='', bn = bv==null || bv==='';
    if(an && bn) return 0; if(an) return 1; if(bn) return -1;
    const r = typeof av==='string' ? av.localeCompare(bv,'ko') : av-bv;
    return r*st.sortDir;
  });
}
function renderResults(rebuildHead=true){
  const v = VIEWS[currentView], st = viewState[currentView];
  const cols = colsFor(currentView);
  cols.forEach((c,i)=>{ c.gs = i>0 && cols[i-1].grp!==c.grp; });
  const list = sortList(applyFilters(currentView), cols, st);
  const pages = Math.max(1, Math.ceil(list.length/PAGE_SIZE));
  if(st.page>=pages) st.page = pages-1;
  if(rebuildHead){
    const groups = [];
    cols.forEach(c=>{ const g = groups[groups.length-1]; if(g && g.grp===c.grp) g.n++; else groups.push({grp:c.grp, n:1}); });
    let head = '<tr class="grp">' + groups.map((g,i)=>`<th colspan="${g.n}" class="${i>0?'gs':''}">${esc(GROUPS[g.grp])}</th>`).join('') + '</tr>';
    head += '<tr class="lab">' + cols.map(c=>`<th data-key="${c.key}" class="${[c.num?'num':'', c.ctr?'ctr':'', c.sticky?'sticky':'', c.gs?'gs':''].join(' ')}" aria-sort="${c.key===st.sortKey?(st.sortDir>0?'ascending':'descending'):'none'}">${esc(c.label)}${c.tip?`<span class="tip" title="${esc(c.tip)}">ⓘ</span>`:''}${c.key===st.sortKey?`<span class="arr">${st.sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('') + '</tr>';
    if(v.headerFilters){
      const baseList = stocks.filter(v.base);
      head += '<tr class="hf">' + cols.map(c=>headFilterCell(c, st, baseList)).join('') + '</tr>';
    }
    const thead = document.getElementById('stockHead');
    thead.innerHTML = head;

function pnorm(s){ return String(s||'').replace(/\(舊[^)]*\)|\(구[^)]*\)/g,'').replace(/\(주\)|㈜|주식회사|\(유\)|\s/g,''); }
function isoOf(yyyymmdd){ return yyyymmdd && yyyymmdd.length===8 ? `${yyyymmdd.slice(0,4)}-${yyyymmdd.slice(4,6)}-${yyyymmdd.slice(6)}` : yyyymmdd; }
function dayDiff(a, b){ return Math.round((Date.parse(a) - Date.parse(b)) / 864e5); }
function fE1(won){ return won==null ? '-' : (won/1e8).toLocaleString('ko-KR',{minimumFractionDigits:1, maximumFractionDigits:1}); }
function fP2(r){ return r==null ? '-' : (r*100).toFixed(2)+'%'; }
function fE1x(n){ return n==null ? '-' : n.toLocaleString('ko-KR',{minimumFractionDigits:1, maximumFractionDigits:1}); }  // 이미 억원 단위인 값
function fN(n){ return n==null ? '-' : Math.round(n).toLocaleString(); }
function fR(x){ return x==null ? '-' : Number(x).toFixed(2)+'%'; }

/* 회사 1곳 지표 계산 (pledge_metrics.company_metrics와 같은 산식). PEF 관점이라 주가 기반 반대매매·안전마진·LTV는 계산하지 않는다 */
function pledgeCompute(c, A, S, asofIso){
  const groups = new Map();
  c.rows.forEach((r,i)=>{ const k = A.mode==='row' ? 'r'+i : `${pnorm(r.p)}|${pnorm(r.ln)}|${r.mt||''}`; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  const facs = [...groups.values()].map(rows=>{
    const r0 = rows[0], f = {rows, p:r0.p, pt:r0.pt, rel:r0.rel, ln:r0.ln, lt:r0.lt, ls:r0.ls, mt:r0.mt, ct:r0.ct, d:r0.d};
    f.sh = rows.reduce((a,r)=>a+(r.sh||0), 0);
    const loans = rows.filter(r=>r.l!=null);
    f.l = loans.length ? loans.reduce((a,r)=>a+r.l, 0) : null;
    const rated = rows.filter(r=>r.l && r.r!=null);
    f.r = rated.length ? rated.reduce((a,r)=>a+r.l*r.r, 0) / rated.reduce((a,r)=>a+r.l, 0) : null;
    const keps = rows.map(r=>r.k).filter(Boolean);
    f.k = keps.length ? Math.max(...keps) : null;
    f.flags = new Set(rows.flatMap(r=>r.f||[]));
    if(new Set(keps).size>1) f.flags.add('KEP_VARIES');
    if(loans.length<rows.length) f.flags.add('PARTIAL_LOAN');
    if(new Set(rows.map(r=>r.cd).filter(Boolean)).size>1) f.flags.add('ADDITIONAL_COLLATERAL');
    if(rows.some(r=>r.sd && r.mt && dayDiff(r.mt, r.sd) <= A.shortDays)) f.flags.add('SHORT_ROLLOVER');
    return f;
  }).sort((a,b)=>(a.mt||'9999').localeCompare(b.mt||'9999') || (b.l||0)-(a.l||0));

  const latest = c.reports.reduce((a,r)=>!a || (r.report_date||'') > (a.report_date||'') ? r : a, null);
  const holding = Math.max(0, ...c.reports.map(r=>r.holding_cnt||0)) || null;
  const x = {facs};
  x.sh = facs.reduce((a,f)=>a+f.sh, 0);
  const loans = facs.filter(f=>f.l!=null);
  x.loan = loans.length ? loans.reduce((a,f)=>a+f.l, 0) : null;
  x.ratio = latest.voting_shares && x.sh ? x.sh / latest.voting_shares : null;
  x.hold = holding && x.sh ? x.sh / holding : null;
  const rated = facs.filter(f=>f.l && f.r!=null);
  x.rate = rated.length ? rated.reduce((a,f)=>a+f.l*f.r, 0) / rated.reduce((a,f)=>a+f.l, 0) : null;
  const mats = [...new Set(facs.map(f=>f.mt).filter(Boolean))].sort();
  const future = mats.filter(m=>m>=asofIso);
  x.mt = future[0] || mats[mats.length-1] || null;
  x.days = x.mt ? dayDiff(x.mt, asofIso) : null;
  x.value = x.sh && c.px ? x.sh * c.px : null;  // 담보주식 시가(지분 인수 규모 가늠용)
  x.nonBank = facs.some(f=>f.ls>=2);           // 2금융권·사채·기타 차입(대환 수요 후보)
  x.latest = latest;
  x.age = latest.report_date ? dayDiff(asofIso, latest.report_date) : null;
  x.buffer = latest.holding_rt!=null ? latest.holding_rt - A.sale : null;

  const flags = new Set((c.m.flags||[]).filter(f=>!['STALE_REPORT','MATURITY_PASSED'].includes(f)));
  if(x.age!=null && x.age > A.stale) flags.add('STALE_REPORT');
  if(mats.length && !future.length) flags.add('MATURITY_PASSED');
  if(c.excluded && c.excluded.CB_COLLATERAL) flags.add('CB_COLLATERAL');
  if(facs.some(f=>f.ls>=3)) flags.add('PRIVATE_LENDER');
  facs.forEach(f=>['SHORT_ROLLOVER','ADDITIONAL_COLLATERAL'].forEach(k=>{ if(f.flags.has(k)) flags.add(k); }));
  x.flags = flags;
  x.high = ['THIRD_PARTY_DEBT','HIGH_RISK_CONTRACT','PARTNERSHIP_PROVIDER','REPORTER_PARTNERSHIP','CB_COLLATERAL','PRIVATE_LENDER'].some(k=>flags.has(k));

  // 스트레스 스코어(우선순위 정렬용 참고지표)
  const sd = S.maturity_days, sh = S.pledge_to_holding;
  const parts = {
    maturity: x.days==null ? 0 : (x.days < 0 || x.days <= sd[0].lte) ? A.d1 : x.days <= sd[1].lte ? A.d2 : 0,
    hold: x.hold==null ? 0 : x.hold > sh[0].gt ? A.h1 : x.hold >= sh[1].gte ? A.h2 : 0,
    lender: Math.max(0, ...facs.map(f=>f.ls>=3 ? A.l3 : f.ls>=2 ? A.l2 : 0)),
    roll: flags.has('SHORT_ROLLOVER') ? A.roll : 0,
    add: flags.has('ADDITIONAL_COLLATERAL') ? A.add : 0,
  };
  x.parts = parts;
  x.score = Object.values(parts).reduce((a,b)=>a+Number(b||0), 0);
  return x;
}
function pledgeRecompute(){
  const A = pA(), S = pledgeData.stress_score, asofIso = isoOf(pledgeData.asof) || new Date().toISOString().slice(0,10);
  pledgeData.companies.forEach(c=>{ c.x = pledgeCompute(c, A, S, asofIso); });
}

function pledgeFilter(){
  const f = PST.f, n = k => f[k]==null || f[k]==='' ? null : Number(f[k]);
  const q = (f.q||'').trim().toLowerCase();
  return pledgeData.companies.filter(c=>{
    const x = c.x, fin = c.fin || {};
    if(q && !c.name.toLowerCase().includes(q) && !c.code.includes(q) && !((memoOf(c.code)||{}).codename||'').toLowerCase().includes(q)) return false;
    if(f.market && c.market!==f.market) return false;
    if(f.ind && c.ind!==f.ind) return false;
    if(n('capMin')!=null && !(c.cap>=n('capMin'))) return false;
    if(n('capMax')!=null && !(c.cap<=n('capMax'))) return false;
    if(n('tvMin')!=null && !(c.tv>=n('tvMin'))) return false;
    if(n('ratioMin')!=null && !(x.ratio*100>=n('ratioMin'))) return false;
    if(n('holdMin')!=null && !(x.hold*100>=n('holdMin'))) return false;
    if(n('loanMin')!=null && !(x.loan/1e8>=n('loanMin'))) return false;
    if(n('loanMax')!=null && !(x.loan/1e8<=n('loanMax'))) return false;
    if(n('rateMin')!=null && !(x.rate>=n('rateMin'))) return false;
    if(f.nonBank && !x.nonBank) return false;
    if(n('daysMax')!=null && !(x.days!=null && x.days<=n('daysMax'))) return false;
    if(f.lender && !c.rows.some(r=>r.lt===f.lender)) return false;
    if(n('scoreMin')!=null && !(x.score>=n('scoreMin'))) return false;
    if(n('ageMax')!=null && !(x.age!=null && x.age<=n('ageMax'))) return false;
    if(f.ptype && !c.rows.some(r=>r.pt===f.ptype)) return false;
    if(f.ceo){ const v = Object.values(c.ceo||{}); if(f.ceo==='__ceo__' ? !v.some(k=>k==='CEO'||k==='CEO_RELATED') : !v.includes(f.ceo)) return false; }
    if(f.excludeHigh && x.high) return false;
    if(f.opPos && fin.op3!==true) return false;
    if(n('debtMax')!=null && !(fin.debt_ratio!=null && fin.debt_ratio<=n('debtMax'))) return false;
    if(n('ndMax')!=null && !(fin.nd_ebitda!=null && fin.nd_ebitda<=n('ndMax'))) return false;
    if(f.auditOk && c.audit!=='적정') return false;
    if(f.noStage && c.stage) return false;
    return true;
  });
}
function pledgeSorted(list){
  const col = PCOLS.find(c=>c.key===PST.sortKey) || PCOLS[0];
  return list.sort((a,b)=>{
    const av = col.get(a), bv = col.get(b);
    const an = av==null || av==='', bn = bv==null || bv==='';
    if(an && bn) return 0; if(an) return 1; if(bn) return -1;
    return (typeof av==='string' ? av.localeCompare(bv,'ko') : av-bv) * PST.sortDir;
  });
}

      return pledgeData;

  return pledgePromise;
}

function renderPledgeResults(){
  const list = pledgeSorted(pledgeFilter());
  const pages = Math.max(1, Math.ceil(list.length/PAGE_SIZE));
  if(PST.page>=pages) PST.page = pages-1;
  const thead = document.getElementById('plHead');
  thead.innerHTML = '<tr class="lab">' + PCOLS.map(c=>`<th data-pk="${c.key}" class="${[c.num?'num':'', c.ctr?'ctr':'', c.sticky?'sticky':''].join(' ')}" style="top:0;" aria-sort="${c.key===PST.sortKey?(PST.sortDir>0?'ascending':'descending'):'none'}">${esc(c.label)}${c.tip?`<span class="tip" title="${esc(c.tip)}">ⓘ</span>`:''}${c.key===PST.sortKey?`<span class="arr">${PST.sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th=>th.addEventListener('click', ()=>{
    const k = th.dataset.pk, col = PCOLS.find(c=>c.key===k);
    if(PST.sortKey===k) PST.sortDir *= -1; else { PST.sortKey = k; PST.sortDir = col.txt || k==='days' ? 1 : -1; }
    renderPledgeResults();
  }));
  const page = list.slice(PST.page*PAGE_SIZE, (PST.page+1)*PAGE_SIZE);
  document.getElementById('plBody').innerHTML = page.map(c=>`<tr data-pcode="${esc(c.code)}" class="${c.code===pledgeSelected?'selected':''}">${PCOLS.map(col=>{
    const cls = [col.num?'num':'', col.ctr?'ctr':'', col.sticky?'sticky':'', col.cls?col.cls(c):''].join(' ').trim();
    return `<td class="${cls}">${col.cell(c)}</td>`; }).join('')}</tr>`).join('') || `<tr><td colspan="${PCOLS.length}" style="text-align:center;padding:20px;color:var(--ink-mute);">결과 없음</td></tr>`;
  document.querySelectorAll('#plBody tr[data-pcode]').forEach(tr=>tr.addEventListener('click', e=>{ if(e.target.closest('a')) return; openPledgeDetail(tr.dataset.pcode); }));
  const pg = document.getElementById('plPager');
  if(pages<=1) pg.innerHTML = '';
  else {
    pg.innerHTML = `<button data-ppg="${PST.page-1}" ${PST.page===0?'disabled':''} aria-label="이전 쪽">‹</button><span>${PST.page+1} / ${pages}</span><button data-ppg="${PST.page+1}" ${PST.page===pages-1?'disabled':''} aria-label="다음 쪽">›</button>`;
    pg.querySelectorAll('[data-ppg]').forEach(b=>b.addEventListener('click', ()=>{ PST.page = Number(b.dataset.ppg); renderPledgeResults(); }));
  }
  const loan = list.reduce((a,c)=>a+(c.x.loan||0), 0);
  document.getElementById('plCount').innerHTML = `<b>${list.length.toLocaleString()}</b>개사 · 대출 ${fE1(loan)}억원 · 행 클릭 시 상세`;
  renderPledgeCharts(list);
}

function renderPledgeCharts(list){
  pledgeCharts.forEach(ch=>ch.destroy()); pledgeCharts = [];
  if(typeof Chart==='undefined') return;
  const pts = list.filter(c=>c.x.rate!=null && c.x.hold!=null).map(c=>({x:+c.x.rate.toFixed(2), y:+(c.x.hold*100).toFixed(1), r:Math.max(3, Math.min(22, Math.sqrt((c.x.loan||0)/1e8)*1.6)), c}));
  pledgeCharts.push(new Chart(document.getElementById('plScatter'), {
    type:'bubble',
    data:{datasets:[{data:pts, backgroundColor:pts.map(p=>p.c.x.high ? 'rgba(198,40,40,.45)' : 'rgba(31,75,143,.40)'), borderColor:pts.map(p=>p.c.x.high ? '#c62828' : '#1f4b8f'), borderWidth:1}]},
    options:{responsive:true, maintainAspectRatio:false,
      onClick:(e, els)=>{ if(els.length) openPledgeDetail(pts[els[0].index].c.code); },
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:t=>{ const p = pts[t.dataIndex]; return `${dispName(p.c)} · 가중금리 ${p.x}% · 보유 대비 ${p.y}% · 대출 ${fE1(p.c.x.loan)}억`; }}}},
      scales:{x:{title:{display:true, text:'가중평균 금리(%, 금리 기재 계약)', font:{size:11}}, grid:{color:'#e3e5e1'}, ticks:{font:{size:10}}},
              y:{title:{display:true, text:'보유 대비 담보비율(%)', font:{size:11}}, min:0, grid:{color:'#e3e5e1'}, ticks:{font:{size:10}}}}},
  }));
  const asofIso = isoOf(pledgeData.asof) || new Date().toISOString().slice(0,10);
  const months = []; const d0 = new Date(asofIso.slice(0,7)+'-01T00:00:00');
  for(let i=0;i<12;i++){ const d = new Date(d0.getFullYear(), d0.getMonth()+i, 1); months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`); }
  const buckets = {'경과':0, ...Object.fromEntries(months.map(m=>[m,0])), '이후':0};
  list.forEach(c=>c.x.facs.forEach(f=>{ if(!f.mt || !f.l) return; const m = f.mt.slice(0,7); const k = f.mt < asofIso ? '경과' : (m in buckets ? m : '이후'); buckets[k] += f.l/1e8; }));
  const labels = Object.keys(buckets);
  pledgeCharts.push(new Chart(document.getElementById('plTimeline'), {
    type:'bar',
    data:{labels:labels.map(l=>l.length===7 ? l.slice(2).replace('-','.') : l), datasets:[{data:labels.map(l=>Math.round(buckets[l]*10)/10), backgroundColor:labels.map((l,i)=>l==='경과' ? '#8a5a06' : i<=1 ? '#c62828' : '#7f97c2')}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:t=>`${t.parsed.y.toLocaleString()}억원`}}},
      scales:{x:{grid:{display:false}, ticks:{font:{size:10}}}, y:{grid:{color:'#e3e5e1'}, ticks:{font:{size:10}}}}},
  }));
}

function pledgeCsv(){
  const list = pledgeSorted(pledgeFilter());
  const cols = PCOLS.filter(c=>c.key!=='flags');
  const plain = (c, col) => { const v = col.get(c); if(col.num) return v==null ? '' : (['ratio','hold'].includes(col.key) ? (v*100).toFixed(2) : ['loan','value'].includes(col.key) ? (v/1e8).toFixed(1) : v); return v ?? ''; };
  const head = [...cols.map(c=>c.label + (['ratio','hold','rate','debt'].includes(c.key)?'(%)':'')), '플래그', '대출기관', '공시 원문'];
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const lines = [head.map(q).join(',')].concat(list.map(c=>[...cols.map(col=>plain(c,col)), [...c.x.flags].map(f=>(FLAG_INFO[f]||[f])[0]).join(' / '),
    [...new Set(c.rows.map(r=>r.ln).filter(Boolean))].join(' / '), c.reports.map(r=>dartUrl(r.rcept_no)).join(' ')].map(q).join(',')));
  const A = pA();
  lines.push('', q(`가정: ${A.mode==='facility'?'대출 단위':'행 단위'} 집계 · 주가 기준일 ${formatDate(pledgeData.asof)} · 출처 DART 대량보유상황보고서(일반)`));
  if(pledgeLocal.codename) lines.push(q('코드네임 표시 모드로 내보냄'));
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `주담대스크리닝_${pledgeData.asof||''}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

    ${c.reports.map(r=>`<div style="margin-bottom:10px;">
      <div style="font-size:12.5px;"><a href="${dartUrl(r.rcept_no)}" target="_blank" rel="noopener" style="color:var(--blue);">${esc(r.report_nm||'보고서')}</a> <span class="when">보고의무발생일 ${esc(r.report_date||'-')} · 접수 ${esc(formatDate(r.rcept_dt))}${x.age!=null && r===x.latest?` · 경과 ${x.age}일`:''}</span></div>
      <div class="note" style="margin-top:2px;">보고자 ${esc(r.reporter_name||'-')} (${esc(PT_LABEL[r.reporter_type]||r.reporter_type||'-')}${r.reporter_job?' · '+esc(r.reporter_job):''}) · 보고자+특별관계자 보유 ${fN(r.holding_cnt)}주 (${r.holding_rt==null?'-':r.holding_rt.toFixed(2)+'%'}) · 의결권 있는 발행주식 ${fN(r.voting_shares)}주 · 계약 합계비율 ${r.sum_trd_rt==null?'-':r.sum_trd_rt.toFixed(2)+'%'}</div>
      ${(r.holders||[]).length?`<table class="fin-tbl" style="margin-top:4px;"><thead><tr><th style="text-align:left;">보유자</th><th class="num">보유주식</th><th class="num">비율</th></tr></thead><tbody>${r.holders.map(h=>`<tr><td>${esc(h.name)}</td><td class="num">${fN(h.cnt)}</td><td class="num">${h.rt==null?'-':h.rt.toFixed(2)+'%'}</td></tr>`).join('')}</tbody></table>`:''}
    </div>`).join('')}

    <h4>재무 요약${fin.y?` (${fin.y}년, 억원)`:''}</h4>
    ${c.fin ? `<div class="kv">
      <div><span>매출액</span><b>${fE1x(fin.rev)}</b></div><div><span>영업이익</span><b>${fE1x(fin.op)}</b></div>
      <div><span>3개년 영업흑자</span><b>${fin.op3==null?'-':fin.op3?'예':'아니오'}</b></div><div><span>부채비율</span><b>${fin.debt_ratio==null?'-':fin.debt_ratio.toFixed(1)+'%'}</b></div>
      <div><span>EBITDA 마진</span><b>${fin.ebitda_margin==null?'-':fin.ebitda_margin.toFixed(1)+'%'}</b></div><div><span>순차입금/EBITDA</span><b>${fin.nd_ebitda==null?'-':fin.nd_ebitda.toFixed(2)+'배'}</b></div>
      <div><span>영업현금흐름</span><b>${fE1x(fin.ocf)}</b></div><div><span>감사의견</span><b>${esc(c.audit||'-')}</b></div>
      <div><span>거래대금(20일 평균)</span><b>${c.tv==null?'-':c.tv.toLocaleString()+'억'}</b></div><div><span>관리종목 등</span><b>${esc(c.stage||'-')}</b></div>
    </div><div class="note">출처: OpenDART 사업보고서(연결 우선)·대시보드 재무 지표. 회계 처리 관련 판단은 참고용이며 최종 판단은 회계법인 확인이 필요합니다.</div>` : '<div class="note">재무정보 없음</div>'}

    <h4>내부 메모 <span class="when">이 브라우저에만 저장</span></h4>
    <div class="memo">
      <div class="controls-row">
        <div class="field"><label for="mm_codename">코드네임</label><input type="text" id="mm_codename" value="${esc(memo.codename||'')}" placeholder="예: Project A"></div>
        <div class="field"><label for="mm_owner">담당자</label><input type="text" id="mm_owner" value="${esc(memo.owner||'')}"></div>
        <div class="field"><label for="mm_status">상태</label><select id="mm_status">${MEMO_STATUS.map(s=>`<option ${s===(memo.status||'미검토')?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <textarea id="mm_memo" style="margin-top:8px;" placeholder="메모">${esc(memo.memo||'')}</textarea>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;">
        <button id="mm_save">저장</button><button class="secondary" id="mm_export">전체 메모 내보내기</button>
        <label class="secondary" style="font-size:12.5px;color:var(--navy);cursor:pointer;border:1px solid var(--navy);border-radius:4px;padding:6px 12px;">메모 불러오기<input type="file" id="mm_import" accept="application/json" style="display:none;"></label>
        <span class="when" id="mm_msg">${memo.updated?`수정 ${esc(memo.updated)}`:''}</span>
      </div>
      <div class="note">진행 중인 딜은 실명 대신 코드네임으로 지칭하십시오. 메모는 레포·서버로 전송되지 않으며, 내보낸 파일은 접근 권한이 있는 사람에게만 전달하십시오.</div>
    </div>
    ${pledgeDisclaimer()}`;
  document.getElementById('mm_save').addEventListener('click', ()=>{
    pledgeLocal.memos[code] = {codename:document.getElementById('mm_codename').value.trim(), owner:document.getElementById('mm_owner').value.trim(),
      status:document.getElementById('mm_status').value, memo:document.getElementById('mm_memo').value, updated:new Date().toLocaleString('ko-KR')};
    lsSave(); document.getElementById('mm_msg').textContent = '저장됨';
    if(currentView==='pledge') renderPledgeResults();
  });
  document.getElementById('mm_export').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(pledgeLocal.memos, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'pledge_memos.json';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 0);
  });
  document.getElementById('mm_import').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    file.text().then(t=>{ const m = JSON.parse(t); if(!m || typeof m!=='object' || Array.isArray(m)) throw new Error('형식 오류');
      Object.entries(m).forEach(([k,v])=>{ if(/^\w{6}$/.test(k) && v && typeof v==='object') pledgeLocal.memos[k] = Object.assign({}, pledgeLocal.memos[k], v); });
      lsSave(); openPledgeDetail(code); if(currentView==='pledge') renderPledgeResults();
    }).catch(err=>{ document.getElementById('mm_msg').textContent = '불러오기 실패: ' + err.message; });
  });
  document.querySelectorAll('#plBody tr[data-pcode]').forEach(tr=>tr.classList.toggle('selected', tr.dataset.pcode===code));
}

/* ---------- 라우팅/로딩 ---------- */
function routeFromHash(){
  const k = location.hash.replace('#','');
  const next = VIEWS[k] || k==='pledge' ? k : 'all';
  if(next!==currentView){ currentView = next; closeDetail(); }
  if(stocks.length) renderView();
}
window.addEventListener('hashchange', routeFromHash);
document.getElementById('closeDetail').addEventListener('click', closeDetail);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(openPop){ openPop=null; renderResults(true); } else closeDetail(); } });
document.addEventListener('click', e=>{ if(openPop && !e.target.closest('.hf-cell')){ openPop=null; renderResults(true); } });

function loadData(){
  document.getElementById('sideFoot').textContent = '불러오는 중...';
  Promise.all([
    fetch(SUMMARY_URL + '?t=' + Date.now()).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }),
    fetch(FINANCIALS_URL + '?t=' + Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
    fetch(HALT_REASONS_URL + '?t=' + Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
    fetch(STAGE_URL + '?t=' + Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
    fetch(EXT_URL + '?t=' + Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
  ]).then(([summary, financials, haltReasons, stageMap, extMap])=>{
    dates = summary.dates; stocks = summary.stocks; financialsMap = financials;
    bySymbol = {};
    stocks.forEach(s=>{ computeStock(s); s.reason = s.halted && haltReasons[s.c] ? haltReasons[s.c].reason : null; s.stage = !s.halted && stageMap[s.c] ? stageMap[s.c].stage : null; s.ext = extMap[s.c] || null; bySymbol[s.c] = s; });
    asofDate = formatDate(summary.asof);
    asofText = `기준일 ${asofDate}`;
    document.getElementById('sideFoot').innerHTML = `<b>${formatDate(summary.asof)}</b>데이터 기준일<br>매일 오전 9시 자동 수집`;
    const maxY = Math.max(0, ...Object.values(financialsMap).flatMap(fm=>Object.keys(fm).map(Number)));
    FISCAL_YEARS = maxY ? [maxY-2, maxY-1, maxY].map(String) : [];
    disclosuresPromise = null;
    pledgePromise = null; loadPledge().then(()=>{ if(currentView==='pledge'){ renderPledgeView(); if(pledgeSelected) openPledgeDetail(pledgeSelected); } });
    renderView();
    if(selectedCode) openDetail(selectedCode);
  }).catch(err=>{
    document.getElementById('emptyState').textContent = '데이터 로드 실패: ' + err.message + ' (build_summary.py를 먼저 실행했는지 확인하세요)';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('sideFoot').textContent = '로드 실패';
  });
}

currentView = VIEWS[location.hash.replace('#','')] || location.hash==='#pledge' ? location.hash.replace('#','') : 'all';
renderNav(); renderHeader();
loadData();
setInterval(loadData, AUTO_REFRESH_MS);
</script>
</body>
