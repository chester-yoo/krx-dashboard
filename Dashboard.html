<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상장사 시가총액 Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f4; --panel:#ffffff; --ink:#161c26; --ink-soft:#5b6472; --ink-mute:#8b93a0;
    --line:#e3e5e1; --line-strong:#c9cdc6;
    --navy:#1f2b3d; --navy-soft:#3a4a63;
    --safe-bg:#e8f2e4; --safe-fg:#2f6b1f; --safe-bd:#bcdcae;
    --watch-bg:#fdf1de; --watch-fg:#8a5a06; --watch-bd:#f2d49b;
    --danger-bg:#fbe7e3; --danger-fg:#a3311f; --danger-bd:#f0bcaf;
    --crit-bg:#7a2115; --crit-fg:#ffffff; --crit-bd:#7a2115;
    --mono: 'Noto Sans KR', sans-serif;
    --side-w:208px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,sans-serif;font-size:14px;line-height:1.5;}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:var(--side-w);flex:0 0 var(--side-w);background:var(--navy);color:#fff;padding:22px 0;position:sticky;top:0;align-self:flex-start;height:100vh;}
  .sidebar h1{font-size:15px;font-weight:700;margin:0 18px 20px;line-height:1.35;}
  .sidebar nav a{display:block;padding:10px 18px;color:#c9d2e0;text-decoration:none;font-size:13.5px;font-weight:500;border-left:3px solid transparent;}
  .sidebar nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar nav a.active{background:rgba(255,255,255,.12);color:#fff;border-left-color:#f2d49b;font-weight:700;}
  .sidebar nav a small{display:block;font-size:11px;color:#97a3b8;font-weight:400;margin-top:1px;}
  .main{flex:1;min-width:0;padding:24px 22px 56px;max-width:1500px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:18px;border-bottom:2px solid var(--navy);padding-bottom:14px;}
  .titleblock h2{font-size:19px;font-weight:700;margin:0 0 4px;color:var(--navy);}
  .titleblock p{margin:0;color:var(--ink-soft);font-size:12px;}
  .asof{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:16px;}
  .panel h3.ph{font-size:12.5px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);margin:0 0 10px;font-weight:700;}
  .controls-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .field input, .field select{padding:6px 8px;border:1px solid var(--line-strong);border-radius:4px;font-family:var(--mono);font-size:13px;width:110px;}
  .field input[type=text]{width:180px;font-family:inherit;}
  .field select{width:140px;font-family:inherit;background:#fff;}
  .field.check{flex-direction:row;align-items:center;gap:6px;padding-bottom:7px;}
  .field.check input{width:auto;}
  .field.check label{font-size:12px;}
  .fin-group{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-strong);}
  .fin-group .glabel{font-size:11.5px;font-weight:700;color:var(--navy);margin-bottom:8px;}
  button{cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:7px 14px;border-radius:4px;font-size:12.5px;font-weight:600;}
  button:hover{opacity:0.9;}
  button.secondary{background:#fff;color:var(--navy);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;}
  .stat .num{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--navy);}
  .stat .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .stat.crit .num{color:var(--danger-fg);} .stat.warn .num{color:var(--watch-fg);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;text-align:center;padding:8px 9px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
  thead th .arr{opacity:.7;font-size:9px;margin-left:3px;}
  tbody td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;}
  tbody tr:hover td{background:#f5f6f4;cursor:pointer;}
  tbody tr.selected td{background:#eef2fa;}
  td.num, th.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;}
  td.sticky, th.sticky{position:sticky;left:0;z-index:1;}
  thead th.sticky{z-index:3;}
  td.neg{color:#d32f2f;font-weight:700;}
  td.mute{color:var(--ink-mute);}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid;}
  .b-safe{background:var(--safe-bg);color:var(--safe-fg);border-color:var(--safe-bd);}
  .b-watch{background:var(--watch-bg);color:var(--watch-fg);border-color:var(--watch-bd);}
  .b-danger{background:var(--danger-bg);color:var(--danger-fg);border-color:var(--danger-bd);}
  .b-crit{background:var(--crit-bg);color:var(--crit-fg);border-color:var(--crit-bd);}
  .b-halt{background:#e5e7eb;color:#374151;border-color:#c7cbd3;margin-left:4px;}
  .mkt-pill{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;border:1px solid;}
  .mkt-pill.kospi{background:#e8edf5;color:#1f4b8f;border-color:#b9c9e6;}
  .mkt-pill.kosdaq{background:#fdf6d9;color:#8a6d00;border-color:#eadd9a;}
  .tablewrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:6px;}
  .tbl-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--ink-soft);}
  .more{text-align:center;padding:10px;}
  .empty{padding:36px 20px;text-align:center;color:var(--ink-mute);}
  #detail{display:none;} #detail.open{display:block;}
  .detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .close-btn{background:none;border:none;color:var(--ink-mute);padding:4px 8px;}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-top:8px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;} .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;}
  .note{font-size:11.5px;color:var(--ink-mute);margin-top:4px;line-height:1.55;}
  @media (max-width:860px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;flex:none;height:auto;position:static;padding:12px 0 0;}
    .sidebar h1{margin:0 14px 8px;}
    .sidebar nav{display:flex;overflow-x:auto;}
    .sidebar nav a{flex:0 0 auto;border-left:none;border-bottom:3px solid transparent;padding:8px 14px;}
    .sidebar nav a small{display:none;}
    .sidebar nav a.active{border-bottom-color:#f2d49b;}
    .main{padding:16px 12px 40px;}
    header{flex-direction:column;align-items:flex-start;gap:6px;}
    .asof{text-align:left;white-space:normal;}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>상장사 시가총액<br>Dashboard</h1>
    <nav id="nav"></nav>
  </aside>

  <div class="main">
    <header>
      <div class="titleblock">
        <h2 id="viewTitle">-</h2>
        <p id="viewDesc"></p>
      </div>
      <div class="asof" id="asofLabel">로딩중...</div>
    </header>

    <div class="panel">
      <h3 class="ph">검색 · 필터</h3>
      <div id="filterArea"></div>
      <div class="note" id="viewNote"></div>
    </div>

    <div class="stats" id="statsRow" style="display:none;"></div>

    <div class="panel" id="detail">
      <div class="detail-head">
        <div><h3 id="detailName" style="margin:0;font-size:15px;">-</h3><div id="detailSub" style="color:var(--ink-soft);font-size:12px;font-family:var(--mono);">-</div></div>
        <button class="close-btn" id="closeDetail">닫기 ✕</button>
      </div>
      <div style="position:relative;height:240px;"><canvas id="trendChart"></canvas></div>
      <div class="legend" id="chartLegend"></div>
      <div id="financialsPanel"></div>
      <div id="disclosuresPanel"></div>
    </div>

    <div class="panel" id="tablePanel" style="display:none;">
      <div class="tbl-meta"><span id="tblCount"></span><span>헤더 클릭 시 정렬 · 행 클릭 시 상세</span></div>
      <div class="tablewrap">
        <table id="stockTable"><thead id="stockHead"></thead><tbody id="stockBody"></tbody></table>
      </div>
      <div class="more" id="moreWrap" style="display:none;"><button class="secondary" id="moreBtn">더 보기</button></div>
    </div>

    <div class="panel empty" id="emptyState">데이터를 불러오는 중입니다...</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const SUMMARY_URL = 'data/summary.json';
const FINANCIALS_URL = 'data/financials.json';
const DISCLOSURES_URL = 'data/disclosures.json';
const AUTO_REFRESH_MS = 30 * 60 * 1000; // 30분마다 자동 새로고침 (수집은 매일 오전 9시 실행)
const PAGE_SIZE = 300;

// 규제 수치 설정 (제도 변경 시 이 블록만 수정)
// current: 현행 관리종목 지정 기준 / next: 상향 예정 기준 / avgDays: 사전검토용 평균 시총 기간
const REG = {
  current: { KOSPI: 300, KOSDAQ: 200, streakDays: 30 },
  next:    { KOSPI: 500, KOSDAQ: 300, effective: '2027-01' },
  avgDays: 30,
};
const DANGER_DAYS = Math.ceil(REG.current.streakDays * 0.66);

let dates = [];
let stocks = [];
let financialsMap = {};
let disclosuresPromise = null;
let disclosuresMap = {};
let bySymbol = {};
let chartObj = null;
let selectedCode = null;
let currentView = 'all';
let shown = PAGE_SIZE;

function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(d){ return d && d.length===8 ? d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8) : (d||''); }
function toEok(won){ return won==null ? null : won/1e8; }
function fmtEok(n){ return n==null ? '-' : Math.round(n).toLocaleString(); }
function fmtPct(n, sign){ return n==null ? '-' : (sign && n>0 ? '+' : '') + n.toFixed(1) + '%'; }
function fmtX(n){ return n==null ? '-' : n.toFixed(2) + '배'; }
function thr(market, set){ return (set==='next' ? REG.next : REG.current)[market] ?? REG[set==='next'?'next':'current'].KOSPI; }

/* ---------- 데이터 가공 ---------- */
function buildFin(code){
  const fm = financialsMap[code];
  if(!fm) return null;
  const ys = Object.keys(fm).sort().reverse();
  if(!ys.length) return null;
  const d = fm[ys[0]];
  const prev = ys[1] && Number(ys[1]) === Number(ys[0])-1 ? fm[ys[1]] : null;
  const f = {
    year: ys[0], fsDiv: d.fs_div==='CFS' ? '연결' : '별도',
    rev: toEok(d.revenue), op: toEok(d.operating_profit), ni: toEok(d.net_income),
    assets: toEok(d.assets), liab: toEok(d.liabilities), eq: toEok(d.equity), capital: toEok(d.capital),
    years: ys.map(y=>({year:y, d:fm[y]})),
  };
  f.opm = f.rev>0 && f.op!=null ? f.op/f.rev*100 : null;
  f.nim = f.rev>0 && f.ni!=null ? f.ni/f.rev*100 : null;
  f.eqNonPos = f.eq!=null && f.eq<=0;
  f.debt = f.eq>0 && f.liab!=null ? f.liab/f.eq*100 : null;
  const pr = prev ? toEok(prev.revenue) : null;
  f.growth = pr>0 && f.rev!=null ? (f.rev/pr-1)*100 : null;
  if(f.eq==null) f.impair = null;
  else if(f.eq<0) f.impair = 'full';
  else if(f.capital!=null) f.impair = f.eq < f.capital ? 'part' : 'none';
  else f.impair = 'unk';
  return f;
}

function computeStock(s){
  const n = s.cap.length;
  let last = null;
  for(let i=n-1;i>=0;i--){ if(s.cap[i]!=null){ last = s.cap[i]; break; } }
  s.latest = last;

  const tail = s.cap.filter(v=>v!=null).slice(-REG.avgDays);
  s.avgN = tail.length;
  s.avg = tail.length ? tail.reduce((a,b)=>a+b,0)/tail.length : null;

  const tCur = thr(s.m,'current');
  let streak = 0;
  for(let i=n-1;i>=0;i--){ const v=s.cap[i]; if(v==null) continue; if(v<tCur) streak++; else break; }
  s.streak = streak;
  s.gapCur = last!=null ? (last/tCur-1)*100 : null;
  if(streak >= REG.current.streakDays){ s.status='crit'; s.statusLabel='관리종목 지정 대상'; s.statusRank=3; }
  else if(streak >= DANGER_DAYS){ s.status='danger'; s.statusLabel=`지정 임박(연속${DANGER_DAYS}일)`; s.statusRank=2; }
  else if(streak >= 1){ s.status='watch'; s.statusLabel='미달 주의'; s.statusRank=1; }
  else { s.status='safe'; s.statusLabel='기준 충족'; s.statusRank=0; }

  const tNext = thr(s.m,'next');
  s.gapNew = s.avg!=null ? (s.avg/tNext-1)*100 : null;
  s.gapCurAvg = s.avg!=null ? (s.avg/tCur-1)*100 : null;
  s.newOnly = s.avg!=null && s.avg>=tCur && s.avg<tNext;

  let k = 0;
  while(k<n && s.h[n-1-k]==='1') k++;
  s.halted = k>0;
  s.haltDays = k;
  s.haltFromStart = k>0 && k===n;
  s.haltStart = k>0 ? dates[n-k] : null;
  s.preHaltCap = null;
  for(let i=n-k-1;i>=0;i--){ if(s.cap[i]!=null){ s.preHaltCap = s.cap[i]; break; } }

  s.fin = buildFin(s.c);
}

/* ---------- 컬럼 정의 ---------- */
const MKT = s => `<span class="mkt-pill ${s.m.toLowerCase()}">${s.m}</span>`;
function badgeHtml(s){
  const cls={watch:'b-watch',danger:'b-danger',crit:'b-crit'}[s.status];
  const st = s.status==='safe' ? '' : `<span class="badge ${cls}">${s.statusLabel}</span>`;
  return st + (s.halted ? '<span class="badge b-halt">거래정지</span>' : '');
}
const C = {
  name:{label:'종목명', sticky:true, get:s=>s.n, cell:s=>esc(s.n)},
  code:{label:'코드', get:s=>s.c, cell:s=>esc(s.c), num:true},
  mkt:{label:'시장', get:s=>s.m, cell:MKT},
  ind:{label:'업종', get:s=>s.i, cell:s=>esc(s.i||'-')},
  cap:{label:'시가총액(억원)', num:true, get:s=>s.latest, cell:s=>fmtEok(s.latest)},
  avg:{label:`${REG.avgDays}일 평균 시총(억원)`, num:true, get:s=>s.avg, cell:s=>fmtEok(s.avg) + (s.avgN<REG.avgDays ? ` <span class="note">(${s.avgN}일)</span>` : '')},
  px:{label:'종가(원)', num:true, get:s=>s.px, cell:s=>s.px==null?'-':Number(s.px).toLocaleString()},
  haltDays:{label:'정지 일수', num:true, get:s=>s.haltDays, cell:s=>s.haltFromStart ? `${s.haltDays}일 이상` : `${s.haltDays}일`},
  haltStart:{label:'정지 시작일', num:true, get:s=>s.haltStart, cell:s=>s.haltStart ? (s.haltFromStart ? '≤ ' : '') + formatDate(s.haltStart) : '-'},
  preCap:{label:'정지 직전 시총(억원)', num:true, get:s=>s.preHaltCap, cell:s=>s.haltFromStart ? '<span class="note">데이터 이전</span>' : fmtEok(s.preHaltCap)},
  gapCur:{label:'현행 기준 대비', num:true, get:s=>s.gapCur, cell:s=>fmtPct(s.gapCur,true), cls:s=>s.gapCur<0?'neg':''},
  streak:{label:'연속미달(거래일)', num:true, get:s=>s.streak, cell:s=>s.streak},
  status:{label:'상태', get:s=>s.statusRank, cell:badgeHtml},
  gapNew:{label:'신규 기준 대비', num:true, get:s=>s.gapNew, cell:s=>fmtPct(s.gapNew,true), cls:s=>s.gapNew<0?'neg':''},
  gapCurAvg:{label:'현행 기준 대비(평균)', num:true, get:s=>s.gapCurAvg, cell:s=>fmtPct(s.gapCurAvg,true), cls:s=>s.gapCurAvg<0?'neg':''},
  tag:{label:'구분', get:s=>s.newOnly?1:0, cell:s=>(s.newOnly ? '<span class="badge b-watch">현행 통과 → 신규 미달</span>' : '<span class="badge b-danger">현행도 미달</span>') + (s.halted ? '<span class="badge b-halt">거래정지</span>' : '')},
};

function finCol(key,label,get,cell,opts={}){ return Object.assign({label, num:true, get:s=>s.fin?get(s.fin,s):null, cell:s=>s.fin?cell(s.fin,s):'-', cls:s=>{const v=s.fin?get(s.fin,s):null; return v==null?'mute':(opts.neg && v<0?'neg':'');}}, opts); }
function makeFinCols(basis){
  return {
    finBase:finCol('finBase','재무 기준',f=>f.year,f=>`${f.year}(${f.fsDiv})`,{num:false}),
    rev:finCol('rev','매출액(억원)',f=>f.rev,f=>fmtEok(f.rev),{neg:true}),
    op:finCol('op','영업이익(억원)',f=>f.op,f=>fmtEok(f.op),{neg:true}),
    opm:finCol('opm','영업이익률',f=>f.opm,f=>fmtPct(f.opm),{neg:true}),
    ni:finCol('ni','당기순이익(억원)',f=>f.ni,f=>fmtEok(f.ni),{neg:true}),
    nim:finCol('nim','순이익률',f=>f.nim,f=>fmtPct(f.nim),{neg:true}),
    assets:finCol('assets','자산총계(억원)',f=>f.assets,f=>fmtEok(f.assets)),
    liab:finCol('liab','부채총계(억원)',f=>f.liab,f=>fmtEok(f.liab)),
    eq:finCol('eq','자본총계(억원)',f=>f.eq,f=>fmtEok(f.eq),{neg:true}),
    debt:finCol('debt','부채비율',f=>f.debt,f=>f.eqNonPos?'N/M':fmtPct(f.debt)),
    growth:finCol('growth','매출성장률(YoY)',f=>f.growth,f=>fmtPct(f.growth,true),{neg:true}),
    pbr:{label:'PBR', num:true, get:s=>pbrOf(s,basis), cell:s=>pbrText(s,basis), cls:s=>pbrOf(s,basis)==null?'mute':''},
    per:{label:'PER', num:true, get:s=>perOf(s,basis), cell:s=>perText(s,basis), cls:s=>perOf(s,basis)==null?'mute':''},
    impair:finCol('impair','자본잠식',f=>({full:3,part:2,unk:0.5,none:0})[f.impair]??null,f=>({full:'<span class="badge b-crit">완전잠식</span>',part:'<span class="badge b-danger">부분잠식</span>',none:'정상',unk:'<span class="note">자본금 미수집</span>'})[f.impair]||'-',{num:false}),
  };
}
function pbrOf(s,basis){ const f=s.fin, c=basis(s); return f && f.eq>0 && c!=null ? c/f.eq : null; }
function perOf(s,basis){ const f=s.fin, c=basis(s); return f && f.ni>0 && c!=null ? c/f.ni : null; }
function pbrText(s,basis){ if(!s.fin||s.fin.eq==null) return '-'; return s.fin.eq<=0 ? 'N/M' : fmtX(pbrOf(s,basis)); }
function perText(s,basis){ if(!s.fin||s.fin.ni==null) return '-'; return s.fin.ni<=0 ? 'N/M' : fmtX(perOf(s,basis)); }

/* ---------- 필터 정의 ---------- */
const PROFIT_OPTS = [['','무관'],['last','최근연도 흑자'],['all3','3개년 연속 흑자'],['loss','최근연도 적자']];
const BASE_FILTERS = [
  {id:'q', label:'종목명/코드 검색', type:'text', ph:'예: 삼성전자, 005930'},
  {id:'market', label:'시장', type:'select', opts:[['','전체'],['KOSPI','KOSPI'],['KOSDAQ','KOSDAQ']]},

function colsFor(view){

/* ---------- 필터 적용 ---------- */
function num(v){ return v==='' || v==null ? null : Number(v); }
function profitOk(mode, years, field){
  const val = y => y.d[field];
  if(!years.length || val(years[0])==null) return null;
  if(mode==='last') return val(years[0])>0;
  if(mode==='loss') return val(years[0])<=0;
  if(mode==='all3'){ const y3=years.slice(0,3); return y3.length>=3 && y3.every(y=>val(y)!=null && val(y)>0); }
  return true;
}
function finPass(s, f, basis){
  const inc = !!f.incNoData, fin = s.fin;
  if(f.opMode){ const r = fin ? profitOk(f.opMode, fin.years, 'operating_profit') : null; if(r===null ? !inc : !r) return false; }
  if(f.niMode){ const r = fin ? profitOk(f.niMode, fin.years, 'net_income') : null; if(r===null ? !inc : !r) return false; }
  const opm=num(f.opmMin); if(opm!=null){ if(!fin||fin.opm==null){ if(!inc) return false; } else if(fin.opm<opm) return false; }
  const gr=num(f.growthMin); if(gr!=null){ if(!fin||fin.growth==null){ if(!inc) return false; } else if(fin.growth<gr) return false; }
  const dm=num(f.debtMax); if(dm!=null){ if(!fin||fin.eq==null||fin.liab==null){ if(!inc) return false; } else if(fin.debt==null||fin.debt>dm) return false; }
  const pm=num(f.pbrMax); if(pm!=null){ if(!fin||fin.eq==null||basis(s)==null){ if(!inc) return false; } else { const p=pbrOf(s,basis); if(p==null||p>pm) return false; } }
  const em=num(f.perMax); if(em!=null){ if(!fin||fin.ni==null||basis(s)==null){ if(!inc) return false; } else { const p=perOf(s,basis); if(p==null||p>em) return false; } }
  if(f.impair){
    if(!fin||fin.impair==null){ if(!inc) return false; }
    else if(fin.impair==='full') return false;
    else if(f.impair==='any' && fin.impair==='part') return false;
  }
  return true;
}
function applyFilters(view){
  const v = VIEWS[view], f = viewState[view].f;
  const q = (f.q||'').trim().toLowerCase();
  const capMin=num(f.capMin), capMax=num(f.capMax), haltMin=num(f.haltMin), streakMin=num(f.streakMin);
  return stocks.filter(v.base).filter(s=>{
    if(q && !s.n.toLowerCase().includes(q) && !s.c.toLowerCase().includes(q)) return false;
    if(f.market && s.m!==f.market) return false;
    if(f.industry && s.i!==f.industry) return false;
    if(capMin!=null && !(s.latest>=capMin)) return false;
    if(capMax!=null && !(s.latest<=capMax)) return false;
    if(haltMin!=null && s.haltDays<haltMin) return false;
    if(streakMin!=null && s.streak<streakMin) return false;
    if(f.status && s.status!==f.status) return false;
    if(f.onlyNew && !s.newOnly) return false;
    if(v.finFilters && !finPass(s,f,v.basis)) return false;
    return true;
  });
}

function renderFilters(){
  const v = VIEWS[currentView], st = viewState[currentView];
  const industries = [...new Set(stocks.map(s=>s.i).filter(Boolean))].sort();
  const ctl = d => {
    const val = st.f[d.id];
    if(d.type==='check') return `<div class="field check"><input type="checkbox" id="f_${d.id}" data-f="${d.id}" ${val?'checked':''}><label for="f_${d.id}">${esc(d.label)}</label></div>`;
    if(d.type==='select'){
      const opts = d.opts==='industry' ? [['','전체'],...industries.map(i=>[i,i])] : d.opts;
      return `<div class="field"><label>${esc(d.label)}</label><select data-f="${d.id}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${a===(val||'')?'selected':''}>${esc(b)}</option>`).join('')}</select></div>`;
    }
    return `<div class="field"><label>${esc(d.label)}</label><input type="${d.type}" data-f="${d.id}" value="${esc(val||'')}" placeholder="${esc(d.ph||'')}"></div>`;
  };
  const baseDefs = v.filters;
  let html = `<div class="controls-row">${baseDefs.map(ctl).join('')}<button class="secondary" id="resetBtn">필터 초기화</button><button id="reloadBtn">데이터 새로고침</button></div>`;
  if(v.finFilters) html += `<div class="fin-group"><div class="glabel">재무 필터 (최근 사업연도 기준, 임계값은 직접 입력)</div><div class="controls-row">${FIN_FILTERS.map(ctl).join('')}</div></div>`;
  document.getElementById('filterArea').innerHTML = html;
  document.querySelectorAll('#filterArea [data-f]').forEach(el=>{
    const evt = el.tagName==='SELECT' || el.type==='checkbox' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      st.f[el.dataset.f] = el.type==='checkbox' ? el.checked : el.value;
      shown = PAGE_SIZE; renderResults();
    });
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{ st.f = {...v.defaults}; shown=PAGE_SIZE; renderFilters(); renderResults(); });
  document.getElementById('reloadBtn').addEventListener('click', loadData);
}

function renderStats(){

function renderResults(){
  const v = VIEWS[currentView], st = viewState[currentView];
  const cols = colsFor(currentView);
  const sc = cols.find(c=>c.key===st.sortKey) || cols[0];
  let list = applyFilters(currentView);
  list.sort((a,b)=>{
    const av=sc.get(a), bv=sc.get(b);
    const an = av==null || av==='', bn = bv==null || bv==='';
    if(an && bn) return 0; if(an) return 1; if(bn) return -1;
    const r = typeof av==='string' ? av.localeCompare(bv,'ko') : av-bv;
    return r*st.sortDir;
  });
  document.getElementById('stockHead').innerHTML = '<tr>' + cols.map(c=>`<th data-key="${c.key}" class="${c.num?'num':''} ${c.sticky?'sticky':''}">${esc(c.label)}${c.key===st.sortKey?`<span class="arr">${st.sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('') + '</tr>';
  const page = list.slice(0, shown);
  document.getElementById('stockBody').innerHTML = page.map(s=>`<tr data-code="${esc(s.c)}" class="${s.c===selectedCode?'selected':''}">${cols.map(c=>{
    const cls = [c.num?'num':'', c.sticky?'sticky':'', c.cls?c.cls(s):''].join(' ').trim();
    return `<td class="${cls}">${c.cell(s)}</td>`;
  }).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" style="text-align:center;padding:20px;color:var(--ink-mute);">결과 없음</td></tr>`;
  document.getElementById('tblCount').textContent = `${list.length.toLocaleString()}개 종목` + (list.length>shown ? ` (상위 ${shown.toLocaleString()}개 표시)` : '');

  document.querySelectorAll('#stockHead th').forEach(th=>th.addEventListener('click', ()=>{
    const k = th.dataset.key;
    if(st.sortKey===k) st.sortDir*=-1; else { st.sortKey=k; st.sortDir = ['name','mkt','ind','code'].includes(k)?1:-1; }
    renderResults();
  }));
  document.querySelectorAll('#stockBody tr[data-code]').forEach(tr=>tr.addEventListener('click', ()=>openDetail(tr.dataset.code)));
  document.getElementById('tablePanel').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
}

      </table>
      <div class="note">출처: OpenDART 공시검색 (주요사항보고)</div>`;
  });
}
function openDetail(code){
  const s = bySymbol[code]; if(!s) return;
  selectedCode = code;
  const tCur = thr(s.m,'current'), tNext = thr(s.m,'next');
  document.getElementById('detail').classList.add('open');
  document.getElementById('detailName').textContent = `${s.n} (${s.c})`;
  document.getElementById('detailSub').textContent = `${s.m}${s.i?' · '+s.i:''} · 현행 ${tCur.toLocaleString()}억 / 신규 ${tNext.toLocaleString()}억 · 연속미달 ${s.streak}거래일${s.halted?' · 거래정지':''}`;
  if(chartObj) chartObj.destroy();
  chartObj = new Chart(document.getElementById('trendChart'), {
    type:'line',
    data:{ labels:dates, datasets:[
      {label:'시가총액', data:s.cap, borderColor:'#1f2b3d', backgroundColor:'rgba(31,43,61,0.08)', fill:true, borderWidth:2, pointRadius:dates.length>60?0:2, tension:0.15, spanGaps:true},
      {label:'현행 기준선', data:dates.map(()=>tCur), borderColor:'#c0392b', borderWidth:1.5, borderDash:[6,4], pointRadius:0, fill:false},
      {label:'신규 기준선', data:dates.map(()=>tNext), borderColor:'#d68910', borderWidth:1.5, borderDash:[2,3], pointRadius:0, fill:false},
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+Number(c.parsed.y).toLocaleString()+'억원'}}},
      scales:{ x:{ticks:{maxTicksLimit:10,font:{size:10}},grid:{display:false}}, y:{ticks:{font:{size:10}},grid:{color:'#e3e5e1'}} } }
  });
  document.getElementById('chartLegend').innerHTML = `<span><i style="background:#1f2b3d;"></i>시가총액(억원)</span><span><i style="background:#c0392b;"></i>현행 기준선 ${tCur.toLocaleString()}억</span><span><i style="background:#d68910;"></i>신규 기준선 ${tNext.toLocaleString()}억 (${REG.next.effective.replace('-','.')}~)</span>`;
  renderFinancials(s);
  renderDisclosures(code);
  document.querySelectorAll('#stockBody tr[data-code]').forEach(tr=>tr.classList.toggle('selected', tr.dataset.code===code));
  document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  selectedCode = null;
  document.querySelectorAll('#stockBody tr.selected').forEach(tr=>tr.classList.remove('selected'));
}

/* ---------- 라우팅/로딩 ---------- */
function routeFromHash(){
  const k = location.hash.replace('#','');
  const next = VIEWS[k] ? k : 'all';
  if(next!==currentView){ currentView = next; shown = PAGE_SIZE; closeDetail(); }
  if(stocks.length) renderView();
}
window.addEventListener('hashchange', routeFromHash);
document.getElementById('closeDetail').addEventListener('click', closeDetail);
document.getElementById('moreBtn').addEventListener('click', ()=>{ shown += PAGE_SIZE; renderResults(); });

function loadData(){
  document.getElementById('asofLabel').textContent = '불러오는 중...';
  Promise.all([
    fetch(SUMMARY_URL + '?t=' + Date.now()).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }),
    fetch(FINANCIALS_URL + '?t=' + Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
  ]).then(([summary, financials])=>{
    dates = summary.dates; stocks = summary.stocks; financialsMap = financials;
    bySymbol = {};
    stocks.forEach(s=>{ computeStock(s); bySymbol[s.c] = s; });
    document.getElementById('asofLabel').textContent = '최신: ' + formatDate(summary.asof) + ' · ' + dates.length + ' 거래일(누적)';
    disclosuresPromise = null;
    renderView();
    if(selectedCode) openDetail(selectedCode);
  }).catch(err=>{
    document.getElementById('emptyState').textContent = '데이터 로드 실패: ' + err.message + ' (build_summary.py를 먼저 실행했는지 확인하세요)';
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('asofLabel').textContent = '로드 실패';
  });
}

currentView = VIEWS[location.hash.replace('#','')] ? location.hash.replace('#','') : 'all';
renderNav(); renderHeader();
loadData();
setInterval(loadData, AUTO_REFRESH_MS);
</script>
